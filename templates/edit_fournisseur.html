<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modifier Fournisseur</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body">

            <h1 class="mb-4">
                Modifier le Fournisseur
            </h1>

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Nom
                    </label>

                    <input
                        type="text"
                        name="nom"
                        class="form-control"
                        value="{{ fournisseur[1] }}"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Adresse
                    </label>

                    <textarea
                        name="adresse"
                        class="form-control"
                        rows="3"
                    >{{ fournisseur[2] or '' }}</textarea>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Téléphone
                    </label>

                    <input
                        type="text"
                        name="telephone"
                        class="form-control"
                        value="{{ fournisseur[3] or '' }}"
                    >

                </div>


                <div class="mb-4">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        value="{{ fournisseur[4] or '' }}"
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Enregistrer
                </button>


                <a
                    href="/fournisseurs"
                    class="btn btn-secondary"
                >
                    Annuler
                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
