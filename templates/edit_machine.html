<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Modifier Machine</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow-sm">

        <div class="card-body p-4">

            <h1 class="mb-4">
                Modifier la Machine
            </h1>

            <form method="POST">

                <!-- Marque -->

                <div class="mb-3">

                    <label class="form-label">
                        Marque
                    </label>

                    <input
                        type="text"
                        name="marque"
                        class="form-control"
                        value="{{ machine[1] }}"
                        required
                    >

                </div>


                <!-- Modèle -->

                <div class="mb-3">

                    <label class="form-label">
                        Modèle
                    </label>

                    <input
                        type="text"
                        name="modele"
                        class="form-control"
                        value="{{ machine[2] }}"
                        required
                    >

                </div>


                <!-- Numéro de série -->

                <div class="mb-3">

                    <label class="form-label">
                        Numéro de série
                    </label>

                    <input
                        type="text"
                        name="num_serie"
                        class="form-control"
                        value="{{ machine[3] }}"
                        required
                    >

                </div>


                <!-- Année -->

                <div class="mb-3">

                    <label class="form-label">
                        Année de fabrication
                    </label>

                    <input
                        type="number"
                        name="annee_fabrication"
                        class="form-control"
                        value="{{ machine[4] or '' }}"
                    >

                </div>


                <!-- Client -->

                <div class="mb-4">

                    <label class="form-label">
                        Client
                    </label>

                    <select
                        name="id_client"
                        class="form-select"
                        required
                    >

                        {% for client in clients %}

                        <option
                            value="{{ client[0] }}"
                            {% if client[0] == machine[5] %}
                                selected
                            {% endif %}
                        >

                            {{ client[1] }} {{ client[2] or '' }}

                        </option>

                        {% endfor %}

                    </select>

                </div>


                <button
                    type="submit"
                    class="btn btn-outline-primary"
                >
                    Enregistrer
                </button>


                <a
                    href="/machines"
                    class="btn btn-outline-secondary ms-2"
                >
                    Annuler
                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
