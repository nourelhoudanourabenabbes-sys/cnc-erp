<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modifier Stock</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body">

            <h1 class="mb-4">
                Modifier le Stock
            </h1>


            <form method="POST">


                <!-- Pièce -->

                <div class="mb-3">

                    <label class="form-label">
                        Pièce détachée
                    </label>

                    <select
                        name="id_piece"
                        class="form-select"
                        required
                    >

                        {% for piece in pieces %}

                        <option
                            value="{{ piece[0] }}"
                            {% if piece[0] == stock[1] %}selected{% endif %}
                        >

                            {{ piece[1] }}
                            - Réf : {{ piece[2] }}

                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- Quantité -->

                <div class="mb-3">

                    <label class="form-label">
                        Quantité disponible
                    </label>

                    <input
                        type="number"
                        name="quantite_disponible"
                        class="form-control"
                        min="0"
                        value="{{ stock[2] }}"
                        required
                    >

                </div>


                <!-- Seuil -->

                <div class="mb-3">

                    <label class="form-label">
                        Seuil d'alerte
                    </label>

                    <input
                        type="number"
                        name="seuil_alerte"
                        class="form-control"
                        min="0"
                        value="{{ stock[3] }}"
                        required
                    >

                </div>


                <!-- Emplacement -->

                <div class="mb-3">

                    <label class="form-label">
                        Emplacement
                    </label>

                    <input
                        type="text"
                        name="emplacement"
                        class="form-control"
                        value="{{ stock[4] or '' }}"
                    >

                </div>


                <!-- Local -->

                <div class="mb-3">

                    <label class="form-label">
                        Local
                    </label>

                    <input
                        type="text"
                        name="local"
                        class="form-control"
                        value="{{ stock[5] or '' }}"
                    >

                </div>


                <!-- Étagère -->

                <div class="mb-3">

                    <label class="form-label">
                        Étagère
                    </label>

                    <input
                        type="text"
                        name="etagere"
                        class="form-control"
                        value="{{ stock[6] or '' }}"
                    >

                </div>


                <!-- Colonne -->

                <div class="mb-4">

                    <label class="form-label">
                        Colonne
                    </label>

                    <input
                        type="text"
                        name="colonne"
                        class="form-control"
                        value="{{ stock[7] or '' }}"
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Enregistrer
                </button>


                <a
                    href="/stock"
                    class="btn btn-secondary"
                >
                    Annuler
                </a>


            </form>

        </div>

    </div>

</div>


</body>

</html>
