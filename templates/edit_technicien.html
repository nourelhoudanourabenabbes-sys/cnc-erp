<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <title>Modifier Technicien</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body">

            <h1 class="mb-4">
                Modifier le Technicien
            </h1>


            <form method="POST">


                <div class="mb-3">

                    <label class="form-label">
                        Nom
                    </label>

                    <input
                        type="text"
                        name="nom"
                        class="form-control"
                        value="{{ technicien[1] }}"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Prénom
                    </label>

                    <input
                        type="text"
                        name="prenom"
                        class="form-control"
                        value="{{ technicien[2] }}"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Spécialité
                    </label>

                    <input
                        type="text"
                        name="specialite"
                        class="form-control"
                        value="{{ technicien[3] or '' }}"
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Téléphone
                    </label>

                    <input
                        type="text"
                        name="telephone"
                        class="form-control"
                        value="{{ technicien[4] or '' }}"
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        value="{{ technicien[5] or '' }}"
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Enregistrer
                </button>


                <a
                    href="/techniciens"
                    class="btn btn-secondary"
                >
                    Annuler
                </a>


            </form>

        </div>

    </div>

</div>


</body>

</html>
