<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ajouter Intervention - CNC ERP</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


<div class="container mt-5">

    <div class="card shadow-sm">

        <div class="card-body p-4">

            <h1 class="mb-4">
                Ajouter une Intervention
            </h1>


            <form method="POST">


                <!-- Date -->

                <div class="mb-3">

                    <label class="form-label">
                        Date d'intervention
                    </label>

                    <input
                        type="date"
                        name="date_intervention"
                        class="form-control"
                        required
                    >

                </div>


                <!-- Durée -->

                <div class="mb-3">

                    <label class="form-label">
                        Durée (heures)
                    </label>

                    <input
                        type="number"
                        name="duree"
                        class="form-control"
                        step="0.5"
                        min="0"
                        placeholder="Ex: 2.5"
                    >

                </div>


                <!-- Type -->

                <div class="mb-3">

                    <label class="form-label">
                        Type d'intervention
                    </label>

                    <select
                        name="type_intervention"
                        class="form-select"
                        required
                    >

                        <option value="">
                            -- Sélectionner --
                        </option>

                        <option value="Maintenance">
                            Maintenance
                        </option>

                        <option value="Réparation">
                            Réparation
                        </option>

                        <option value="Installation">
                            Installation
                        </option>

                        <option value="Diagnostic">
                            Diagnostic
                        </option>

                    </select>

                </div>


                <!-- Description -->

                <div class="mb-3">

                    <label class="form-label">
                        Description
                    </label>

                    <textarea
                        name="description"
                        class="form-control"
                        rows="4"
                        placeholder="Décrire l'intervention..."
                    ></textarea>

                </div>


                <!-- Machine -->

                <div class="mb-3">

                    <label class="form-label">
                        Machine
                    </label>

                    <select
                        name="id_machine"
                        class="form-select"
                        required
                    >

                        <option value="">
                            -- Sélectionner une machine --
                        </option>


                        {% for machine in machines %}

                        <option value="{{ machine[0] }}">

                            {{ machine[1] }}
                            {{ machine[2] }}
                            - N° série : {{ machine[3] }}

                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- Technicien -->

                <div class="mb-3">

                    <label class="form-label">
                        Technicien
                    </label>

                    <select
                        name="id_technicien"
                        class="form-select"
                        required
                    >

                        <option value="">
                            -- Sélectionner un technicien --
                        </option>


                        {% for technicien in techniciens %}

                        <option value="{{ technicien[0] }}">

                            {{ technicien[2] }}
                            {{ technicien[1] }}

                            {% if technicien[3] %}
                                - {{ technicien[3] }}
                            {% endif %}

                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- Statut -->

                <div class="mb-4">

                    <label class="form-label">
                        Statut
                    </label>

                    <select
                        name="statut"
                        class="form-select"
                        required
                    >

                        <option value="En attente">
                            En attente
                        </option>

                        <option value="En cours">
                            En cours
                        </option>

                        <option value="Terminée">
                            Terminée
                        </option>

                        <option value="Annulée">
                            Annulée
                        </option>

                    </select>

                </div>


                <!-- Boutons -->

                <button
                    type="submit"
                    class="btn btn-outline-primary"
                >
                    Ajouter
                </button>


                <a
                    href="/interventions"
                    class="btn btn-outline-secondary ms-2"
                >
                    Retour
                </a>


            </form>

        </div>

    </div>

</div>


</body>

</html>
