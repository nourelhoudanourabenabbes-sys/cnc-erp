<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ajouter Client</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


<div class="container mt-5">


    <div class="card shadow-sm">

        <div class="card-body p-4">


            <h1 class="mb-4">

                Ajouter un Client

            </h1>


            <form method="POST">


                <!-- Nom -->

                <div class="mb-3">

                    <label class="form-label">

                        Nom

                    </label>

                    <input
                        type="text"
                        name="nom"
                        class="form-control"
                        required
                    >

                </div>


                <!-- Prénom -->

                <div class="mb-3">

                    <label class="form-label">

                        Prénom

                    </label>

                    <input
                        type="text"
                        name="prenom"
                        class="form-control"
                        required
                    >

                </div>


                <!-- Adresse -->

                <div class="mb-3">

                    <label class="form-label">

                        Adresse

                    </label>

                    <textarea
                        name="adresse"
                        class="form-control"
                        rows="3"
                    ></textarea>

                </div>


                <!-- Téléphone -->

                <div class="mb-3">

                    <label class="form-label">

                        Téléphone

                    </label>

                    <input
                        type="text"
                        name="telephone"
                        class="form-control"
                    >

                </div>


                <!-- Email -->

                <div class="mb-3">

                    <label class="form-label">

                        Email

                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                    >

                </div>


                <!-- Numéro fiscal -->

                <div class="mb-4">

                    <label class="form-label">

                        Numéro fiscal

                    </label>

                    <input
                        type="text"
                        name="num_fiscal"
                        class="form-control"
                    >

                </div>


                <!-- Boutons -->

                <button
                    type="submit"
                    class="btn btn-outline-primary"
                >

                    Ajouter

                </button>


                <a
                    href="/clients"
                    class="btn btn-outline-secondary ms-2"
                >

                    Annuler

                </a>


            </form>


        </div>

    </div>


</div>


</body>

</html>
