<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ajouter une pièce</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body">

            <h1 class="mb-4">
                Ajouter une pièce détachée
            </h1>


            <form method="POST">


                <div class="mb-3">

                    <label class="form-label">
                        Nom
                    </label>

                    <input
                        type="text"
                        name="nom"
                        class="form-control"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Référence
                    </label>

                    <input
                        type="text"
                        name="reference"
                        class="form-control"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Prix unitaire
                    </label>

                    <input
                        type="number"
                        name="prix_unitaire"
                        class="form-control"
                        step="0.01"
                        min="0"
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Fournisseur
                    </label>

                    <select
                        name="id_fournisseur"
                        class="form-select"
                        required
                    >

                        <option value="">
                            -- Sélectionner un fournisseur --
                        </option>

                        {% for fournisseur in fournisseurs %}

                        <option value="{{ fournisseur[0] }}">
                            {{ fournisseur[1] }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        État
                    </label>

                    <select
                        name="etat"
                        class="form-select"
                    >

                        <option value="Neuf">
                            Neuf
                        </option>

                        <option value="Occasion">
                            Occasion
                        </option>

                        <option value="Endommagé">
                            Endommagé
                        </option>

                    </select>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Prix d'achat
                    </label>

                    <input
                        type="number"
                        name="prix_achat"
                        class="form-control"
                        step="0.01"
                        min="0"
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Prix de vente
                    </label>

                    <input
                        type="number"
                        name="prix_vente"
                        class="form-control"
                        step="0.01"
                        min="0"
                    >

                </div>


                <div class="mb-4">

                    <label class="form-label">
                        Photo
                    </label>

                    <input
                        type="text"
                        name="photo"
                        class="form-control"
                        placeholder="Nom du fichier image"
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Enregistrer
                </button>


                <a
                    href="/pieces"
                    class="btn btn-secondary"
                >
                    Annuler
                </a>


            </form>

        </div>

    </div>

</div>


</body>

</html>
